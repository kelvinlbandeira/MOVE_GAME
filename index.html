:root{
  --ink:#2A2320;
  --ink-soft:#372E28;
  --paper:#F8F3EA;
  --paper-dim:#EFE4D3;
  --brown:#7E5F49;
  --brown-dim:#C9AF95;
  --sage:#7C8B69;
  --gold:#BC8A46;
  --slate:#7A6F63;
  --line:rgba(42,35,32,0.14);
  --line-light:rgba(248,243,234,0.18);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:'Cocon','Inter',sans-serif;
  min-height:100vh;
}
.mono{font-family:'IBM Plex Mono',monospace;}
.display{font-family:'Cocon',sans-serif; letter-spacing:0.03em;}

/* ===== TOP NAV ===== */
.topbar{
  background:var(--paper);
  color:var(--ink);
  padding:16px 24px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  position:sticky; top:0; z-index:50;
  border-bottom:2px solid var(--brown);
}
.brand{
  display:flex; align-items:center; gap:9px;
}
.topbar-logo{height:36px; width:auto; display:block;}

.game-dynamic{
  font-family:'Baloo 2',sans-serif; font-weight:800; font-style:normal;
  display:inline-block; letter-spacing:0.01em;
  color:var(--brown); -webkit-text-stroke:0.5px var(--brown);
}
.game-dynamic-sm{ font-size:17px; }
.game-dynamic-lg{
  font-size:clamp(20px,3.6vw,28px); margin-top:8px;
}
.nav-toggle{display:flex; gap:6px; background:var(--paper-dim); padding:4px; border-radius:100px;}
.nav-toggle button{
  border:none; background:transparent; color:var(--ink); opacity:0.55;
  font-family:'Inter',sans-serif; font-weight:600; font-size:13px;
  padding:8px 16px; border-radius:100px; cursor:pointer; transition:all .2s;
}
.nav-toggle button.active{background:var(--brown); color:white; opacity:1;}

/* ===== LANDING ===== */
.hero{
  padding:64px 24px 40px; text-align:center; max-width:760px; margin:0 auto;
}
.hero .eyebrow{
  font-family:'IBM Plex Mono',monospace; font-size:12px; letter-spacing:0.15em;
  text-transform:uppercase; color:var(--brown); font-weight:600;
}
.hero h1{
  font-family:'Cocon',sans-serif; font-size:clamp(48px,10vw,92px);
  line-height:0.92; margin:10px 0 6px; letter-spacing:0.01em;
}
.hero p{color:var(--slate); font-size:16px; line-height:1.55; max-width:520px; margin:14px auto 0;}
.hero-logo{height:clamp(64px,13vw,124px); width:auto; margin-top:6px;}
.hero-tagline{
  font-family:'Cocon',sans-serif; font-size:clamp(21px,3.6vw,30px); font-weight:600;
  color:var(--ink); line-height:1.35; margin:26px 0 0; letter-spacing:0.01em;
}
.num-accent{ color:var(--brown); font-weight:700; }
.hero-dates{
  margin-top:30px; display:flex; align-items:center; justify-content:center; gap:10px;
  flex-wrap:wrap; font-family:'IBM Plex Mono',monospace;
}
.hero-range{ color:var(--slate); font-size:13px; letter-spacing:0.03em; }
.hero-dot{ color:var(--brown-dim); font-size:13px; }
.hero-live{ color:var(--brown); font-size:13px; font-weight:600; letter-spacing:0.03em; text-transform:uppercase; }
.ig-badge{
  display:inline-flex; align-items:center; gap:6px; margin-top:16px; padding:8px 16px;
  border:1.5px solid var(--brown); border-radius:100px; color:var(--brown); text-decoration:none;
  font-family:'Inter',sans-serif; font-size:12.5px; font-weight:600; transition:all .2s;
}
.ig-badge:hover{ background:var(--brown); color:white; }
.ig-reminder{
  font-size:12px; color:var(--slate); margin-top:6px; padding:0 2px; line-height:1.5;
}
.ig-reminder a{ color:var(--brown); font-weight:700; text-decoration:none; }
.ig-reminder a:hover{ text-decoration:underline; }
.hero .dates{
  margin-top:24px; display:flex; gap:10px; justify-content:center; flex-wrap:wrap;
}
.pill{
  border:1.5px solid var(--brown); border-radius:100px; padding:7px 16px; color:var(--ink);
  font-family:'IBM Plex Mono',monospace; font-size:12.5px; font-weight:600;
}
.pill.filled{background:var(--brown); color:white; border-color:var(--brown);}

/* ===== TRACK (signature element) ===== */
.track-wrap{max-width:760px; margin:38px auto 0; padding:0 24px;}
.track{
  display:flex; position:relative; padding:22px 0;
}
.track::before{
  content:''; position:absolute; top:50%; left:0; right:0; height:2px;
  background:repeating-linear-gradient(90deg, var(--ink) 0 10px, transparent 10px 20px);
  transform:translateY(-50%); z-index:0; opacity:0.35;
}
.lane{
  flex:1; display:flex; flex-direction:column; align-items:center; position:relative; z-index:1; cursor:pointer;
}
.lane .dot{
  width:34px; height:34px; border-radius:50%; background:var(--paper); border:2px solid var(--ink);
  display:flex; align-items:center; justify-content:center; font-family:'IBM Plex Mono',monospace;
  font-size:12px; font-weight:700; transition:all .2s;
}
.lane.done .dot{background:var(--sage); border-color:var(--sage); color:white;}
.lane.current .dot{background:var(--brown); border-color:var(--brown); color:white; transform:scale(1.15);}
.lane .lbl{font-size:10px; margin-top:6px; color:var(--slate); font-weight:600;}
.lane.locked .dot{background:var(--paper-dim); border-color:var(--line); color:var(--slate); font-size:13px;}
.lane.locked .lbl{opacity:0.55;}
.lane.past .dot{background:white; border-color:var(--line); color:var(--slate);}
.lane.past .lbl{opacity:0.7;}

/* ===== CARDS / SECTIONS ===== */
.wrap{max-width:760px; margin:0 auto; padding:0 24px 80px;}
.card{
  background:white; border:1.5px solid var(--line); border-radius:16px; padding:26px;
  margin-top:20px;
}
.card h3{
  font-family:'Cocon',sans-serif; font-size:24px; letter-spacing:0.02em; margin:0 0 4px;
}
.card .sub{color:var(--slate); font-size:13px; margin-bottom:16px;}
label{display:block; font-size:12.5px; font-weight:600; margin:14px 0 6px; color:var(--ink);}
input[type=text], input[type=file], textarea, select{
  width:100%; padding:11px 13px; border:1.5px solid var(--line); border-radius:10px;
  font-family:'Inter',sans-serif; font-size:16px; background:var(--paper); color:var(--ink);
}
textarea{resize:vertical; min-height:60px;}
input:focus, textarea:focus, select:focus{outline:2px solid var(--brown); outline-offset:1px;}

.check-row{
  display:flex; align-items:flex-start; gap:12px; padding:14px 0; border-top:1px solid var(--line);
}
.check-row:first-of-type{border-top:none;}
.check-row input[type=checkbox]{
  width:22px; height:22px; margin-top:2px; accent-color:var(--sage); flex-shrink:0; cursor:pointer;
}
.check-row .txt strong{font-size:14.5px; display:block;}
.check-row .txt span{font-size:12.5px; color:var(--slate);}
.check-row .txt-head{display:flex; align-items:center; gap:8px; cursor:pointer; user-select:none;}
.task-check{color:var(--sage); font-weight:800; font-size:14px; min-width:14px;}
.check-row .txt-head .chev{margin-left:auto; font-size:11px; color:var(--slate); transition:transform .2s;}
.check-row .txt-head.open .chev{transform:rotate(180deg);}
.check-row.read-only{opacity:0.85;}
.chev-btn{
  margin-left:auto; font-size:11px; font-weight:700; color:var(--brown);
  background:var(--paper-dim); padding:5px 12px; border-radius:100px; white-space:nowrap;
}
.task-locked-badge{
  background:#EAF3EA; color:#2F6B2F; font-size:12.5px; font-weight:600;
  padding:10px 14px; border-radius:10px; margin:2px 0 14px;
}
.partner-ig{margin-top:8px; font-size:12px;}
.partner-ig a{color:var(--brown); font-weight:700; text-decoration:none;}
.partner-ig a:hover{text-decoration:underline;}
.workflow-tip{
  background:#FFF8E8; border:1px solid #F0DFA8; color:#7A5C00; font-size:12.5px;
  line-height:1.55; padding:12px 14px; border-radius:10px; margin:14px 0 4px;
}
.final-checkin-box{
  background:var(--paper); border:1.5px dashed var(--brown); border-radius:14px;
  padding:18px; text-align:center; margin-top:20px;
}
.final-checkin-title{font-family:'Cocon',sans-serif; font-size:17px; color:var(--ink); font-weight:600;}
.checkin-done-badge{
  background:#EAF3EA; color:#2F6B2F; font-size:14px; font-weight:700;
  padding:16px; border-radius:14px; text-align:center; margin-top:20px; line-height:1.5;
}
.checkin-done-motivation{
  font-family:'Cocon',sans-serif; font-size:15px; font-weight:400; color:#245424;
  margin-top:8px; line-height:1.4;
}
.whatsapp-share-btn{
  display:flex; align-items:center; justify-content:center; gap:8px; margin-top:12px;
  padding:12px 18px; border-radius:100px; background:#25D366; color:white;
  text-decoration:none; font-family:'Inter',sans-serif; font-size:13.5px; font-weight:700;
}
.whatsapp-share-btn:hover{ opacity:0.9; }
.video-btn{
  display:inline-flex; align-items:center; gap:6px; margin-top:14px; padding:10px 18px;
  border-radius:100px; background:var(--ink); color:white; text-decoration:none;
  font-family:'Inter',sans-serif; font-size:13px; font-weight:700;
}
.video-btn:hover{opacity:0.85;}
.check-row .taskdesc{
  font-size:12.5px; color:var(--slate); line-height:1.55; font-weight:400;
  max-height:0; overflow:hidden; margin-top:0; transition:max-height .25s ease, margin-top .25s ease;
}
.check-row .taskdesc.open{max-height:900px; margin-top:8px;}
.relampago-badge{
  background:#FFF4E0; color:#8A5A00; border:1.5px dashed #E0A83E; border-radius:10px;
  padding:12px 14px; font-size:12.5px; font-weight:600; margin-top:14px; line-height:1.5;
}

.btn{
  border:none; background:var(--brown); color:white; font-weight:700; font-size:14px;
  padding:13px 22px; border-radius:10px; cursor:pointer; font-family:'Inter',sans-serif;
  width:100%; margin-top:18px; transition:transform .1s;
}
.btn:active{transform:scale(0.98);}
.btn.dark{background:var(--ink);}
.btn.ghost{background:transparent; border:1.5px solid var(--ink); color:var(--ink);}
.btn.small{width:auto; padding:9px 16px; font-size:13px; margin-top:0;}
.btn:disabled{opacity:0.45; cursor:not-allowed;}

.msg{padding:12px 14px; border-radius:10px; font-size:13px; margin-top:14px; font-weight:600;}
.msg.ok{background:#E5F7EE; color:#1E8A57;}
.msg.err{background:#FDE8E8; color:#C0392B;}

/* score badge */
.score-strip{display:flex; gap:10px; margin-top:20px;}
.score-box{flex:1; background:var(--ink); color:var(--paper); border-radius:14px; padding:16px; text-align:center;}
.score-box .num{font-family:'Cocon',sans-serif; font-size:34px; color:var(--gold);}
.score-box .lbl{font-size:10.5px; text-transform:uppercase; letter-spacing:0.08em; color:var(--slate); margin-top:2px;}

/* ranking table */
table{width:100%; border-collapse:collapse; font-size:13px;}
th{
  text-align:left; padding:10px 8px; font-size:10.5px; text-transform:uppercase; letter-spacing:0.06em;
  color:var(--slate); border-bottom:2px solid var(--ink); font-family:'IBM Plex Mono',monospace;
}
td{padding:10px 8px; border-bottom:1px solid var(--line);}
tr.rank1 td:first-child, tr.rank2 td:first-child, tr.rank3 td:first-child{font-weight:800;}
.medal{display:inline-block; width:20px; text-align:center;}

.thumb{width:100%; max-height:220px; object-fit:cover; border-radius:10px; margin-top:10px; display:block;}
.thumb-admin{width:100%; max-height:420px; object-fit:contain; background:var(--paper-dim); border-radius:10px; margin-top:10px; display:block; cursor:pointer;}

.two-col{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
@media(max-width:520px){.two-col{grid-template-columns:1fr;}}

/* ===== MOBILE-FIRST FINE TUNING (narrow phones, ~320-400px) ===== */
@media(max-width:400px){
  .topbar{ padding:12px 16px; flex-wrap:wrap; gap:10px; row-gap:8px; }
  .brand{ gap:6px; }
  .topbar-logo{ height:30px; }
  .game-dynamic-sm{ font-size:15px; }
  .nav-toggle{ padding:3px; }
  .nav-toggle button{ padding:7px 12px; font-size:12px; }
  .wrap{ padding:0 16px 60px; }
  .hero{ padding:44px 16px 28px; }
  .card{ padding:18px 16px; }
  .log-row{ flex-wrap:wrap; row-gap:2px; }
  .log-row .log-name{ flex-basis:100%; }
  .log-row .log-phone{ order:2; }
  .log-row .log-time{ order:3; margin-left:auto; }
}

.code-box{
  background:var(--paper-dim); border:1.5px dashed var(--ink); border-radius:10px; padding:14px;
  text-align:center; margin-top:10px;
}
.code-box .code{font-family:'IBM Plex Mono',monospace; font-size:22px; font-weight:700; letter-spacing:0.1em;}

.list-item{
  display:flex; justify-content:space-between; align-items:center; padding:12px 0; border-top:1px solid var(--line);
}
.list-item:first-child{border-top:none;}
.list-item .name{font-weight:700; font-size:14px;}
.list-item .code{font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--slate);}

.tabbar{display:flex; gap:6px; overflow-x:auto; padding-bottom:4px; margin-top:8px;}
.log-table{display:flex; flex-direction:column; gap:2px;}
.log-row{display:flex; align-items:center; gap:12px; padding:10px 8px; border-bottom:1px solid var(--paper-dim); font-size:13px;}
.log-row .log-name{font-weight:600; flex:1;}
.log-row .log-phone{color:var(--slate); font-family:'IBM Plex Mono',monospace; font-size:12px;}
.log-row .log-time{color:var(--brown); font-family:'IBM Plex Mono',monospace; font-size:12px; white-space:nowrap;}
.tabbar button{
  flex-shrink:0; border:1.5px solid var(--ink); background:white; padding:8px 14px; border-radius:100px;
  font-family:'IBM Plex Mono',monospace; font-size:12px; font-weight:600; cursor:pointer;
}
.tabbar button.active{background:var(--ink); color:white;}

.loading-screen{
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  min-height:60vh; padding:40px; gap:18px;
}
.loading-logo{
  width:140px; height:auto; animation:loadingPulse 1.6s ease-in-out infinite;
}
@keyframes loadingPulse{
  0%, 100%{ opacity:0.55; transform:scale(0.97); }
  50%{ opacity:1; transform:scale(1.03); }
}
.loading-dots{ display:flex; gap:6px; }
.loading-dots span{
  width:7px; height:7px; border-radius:50%; background:var(--brown);
  animation:loadingDot 1.2s ease-in-out infinite;
}
.loading-dots span:nth-child(2){ animation-delay:0.15s; }
.loading-dots span:nth-child(3){ animation-delay:0.3s; }
@keyframes loadingDot{
  0%, 80%, 100%{ opacity:0.25; transform:translateY(0); }
  40%{ opacity:1; transform:translateY(-4px); }
}
.footer-note{text-align:center; color:var(--slate); font-size:11px; margin-top:30px; line-height:1.6;}

.homolog-banner{
  background:var(--gold); color:var(--ink); text-align:center; font-family:'IBM Plex Mono',monospace;
  font-size:11.5px; font-weight:700; letter-spacing:0.08em; padding:7px 12px; text-transform:uppercase;
}
.test-hint{
  background:#FFF7E6; border:1.5px dashed var(--gold); border-radius:10px; padding:14px; margin-top:16px; font-size:12.5px;
}
.test-hint b{font-family:'IBM Plex Mono',monospace;}
.test-hint .fillBtn{
  margin-top:10px; width:100%; border:none; background:var(--gold); color:var(--ink); font-weight:700;
  padding:9px; border-radius:8px; cursor:pointer; font-size:12.5px;
}

.mission-card{border:1.5px solid var(--line); border-radius:14px; padding:18px; margin-top:14px; background:var(--paper);}
.mission-card .mhead{display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;}
.mission-card .mhead .badge{
  font-family:'IBM Plex Mono',monospace; font-size:11px; font-weight:700; background:var(--ink); color:white;
  padding:4px 10px; border-radius:100px;
}
.pts-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-top:6px;}
.pts-grid div{display:flex; flex-direction:column;}
.pts-grid label{margin:0 0 4px; font-size:10.5px;}
.pts-grid input{padding:8px; font-size:13px;}
.mission-actions{display:flex; gap:8px; margin-top:14px;}
.mission-actions .btn{margin-top:0;}
.check-inline{display:flex; align-items:center; gap:8px; margin-top:12px;}
.check-inline input{width:18px; height:18px; accent-color:var(--sage);}
.check-inline label{margin:0; font-size:13px;}

.rank-callout{
  background:var(--ink); color:var(--paper); border-radius:14px; padding:18px; text-align:center; margin-top:20px;
}
.rank-callout .num{font-family:'Cocon',sans-serif; font-size:44px; color:var(--gold); line-height:1;}
.rank-callout .lbl{font-size:11px; text-transform:uppercase; letter-spacing:0.08em; color:var(--slate); margin-top:4px;}
.rank-row{
  display:flex; align-items:center; justify-content:space-between; padding:12px 4px; border-top:1px solid var(--line);
}
.rank-row:first-of-type{border-top:none;}
.rank-row.you{background:var(--paper-dim); border-radius:10px; padding:12px 10px;}
.rank-row .left{display:flex; align-items:center; gap:10px;}
.rank-row .pos{font-family:'IBM Plex Mono',monospace; font-weight:700; width:26px; text-align:center;}
.rank-row .nm{font-weight:600; font-size:13.5px;}
.rank-row .pts{font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:13.5px;}
.rank-row .locked{color:var(--slate); font-size:12.5px; font-style:italic;}

</style>
</head>

/* ============ STORAGE HELPERS ============ */
let lastStorageError = '';
async function sGet(key){
  try{
    const r = await fetch('/api/storage?key=' + encodeURIComponent(key), { cache: 'no-store' });
    const data = await r.json();
    return (data.value === null || data.value === undefined) ? null : JSON.parse(data.value);
  }
  catch(e){ console.error('storage get fail', e); return null; }
}
async function sSet(key, value){
  try{
    const json = JSON.stringify(value);
    if(json.length > 4500000){
      lastStorageError = `arquivo grande demais (${(json.length/1024/1024).toFixed(1)}MB).`;
      return false;
    }
    const r = await fetch('/api/storage', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ key, value: json })
    });
    const data = await r.json();
    if(!data.ok){ lastStorageError = data.error || 'falha ao salvar'; return false; }
    return true;
  }
  catch(e){ console.error('storage set fail', e); lastStorageError = (e && e.message) ? e.message : String(e); return false; }
}
async function sList(prefix){
  try{
    const r = await fetch('/api/storage?list=1&prefix=' + encodeURIComponent(prefix || ''), { cache: 'no-store' });
    const data = await r.json();
    return data.keys || [];
  }
  catch(e){ return []; }
}

/* ============ LOGIN LOG ============ */
function renderLogRows(loginLog){
  if(!loginLog || loginLog.length===0){
    return `<div class="sub">Nenhum login registrado ainda.</div>`;
  }
  return `<div class="log-table">` + loginLog.map(entry=>{
    const d = new Date(entry.at);
    const dateStr = d.toLocaleDateString('pt-BR');
    const timeStr = d.toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'});
    return `
      <div class="log-row">
        <div class="log-name">${escapeHtml(entry.name)}</div>
        <div class="log-phone">${formatPhoneDisplay(entry.phone)}</div>
        <div class="log-time">${dateStr} · ${timeStr}</div>
      </div>`;
  }).join('') + `</div>`;
}

async function getLoginLog(){ return (await sGet('moveh:loginlog')) || []; }

let logRefreshTimer = null;
function startLogAutoRefresh(){
  stopLogAutoRefresh();
  logRefreshTimer = setInterval(async ()=>{
    const listEl = document.getElementById('logList');
    if(!listEl) { stopLogAutoRefresh(); return; }
    const loginLog = await getLoginLog();
    listEl.innerHTML = renderLogRows(loginLog);
  }, 15000);
}
function stopLogAutoRefresh(){
  if(logRefreshTimer){ clearInterval(logRefreshTimer); logRefreshTimer = null; }
}
async function logLogin(participant){
  const log = await getLoginLog();
  log.unshift({ name:participant.name, phone:participant.phone, at:new Date().toISOString() });
  if(log.length > 300) log.length = 300;
  await sSet('moveh:loginlog', log);
}

function genCode(){
  return String(Math.floor(1000 + Math.random()*9000));
}
function normalizePhone(phone){
  return (phone||'').replace(/\D/g,'');
}
function formatPhoneDisplay(phone){
  const p = normalizePhone(phone);
  if(p.length===11) return `(${p.slice(0,2)}) ${p.slice(2,7)}-${p.slice(7)}`;
  if(p.length===10) return `(${p.slice(0,2)}) ${p.slice(2,6)}-${p.slice(6)}`;
  return p;
}

function calcPoints(c, dayConfig){
  if(!c) return 0;
  const pts = (dayConfig && dayConfig.points) || {treino:10, alimentacao:10, tarefa:10, bonus:2, instagram:15};
  let total = 0;
  if(c.treino) total += pts.treino;
  if(c.alimentacao) total += pts.alimentacao;
  if(c.tarefa) total += pts.tarefa;
  if(c.bonus) total += pts.bonus;
  if(c.relampagoBonus) total += (pts.instagram || 0);
  const adj = (c.adjustment !== undefined) ? c.adjustment : -(c.penalty || 0);
  total += adj;
  if(total < 0) total = 0;
  return total;
}

async function computeRanking(){
  const participants = await getParticipants();
  const missions = await getMissions();
  const rows = await Promise.all(participants.map(async p=>{
    const checkins = await Promise.all(missions.map(day=>getCheckin(p.phone, day.n)));
    const total = checkins.reduce((sum,c,i)=> sum + calcPoints(c, missions[i]), 0);
    return {...p, total};
  }));
  rows.sort((a,b)=> b.total - a.total);
  return rows;
}

function resizeImage(file, maxW=700, quality=0.62){
  return new Promise((resolve,reject)=>{
    if(file.size > 30*1024*1024){
      reject(new Error('Esse arquivo tem mais de 30MB. Escolha uma foto menor ou tire um print da tela.'));
      return;
    }
    const isHeic = /heic|heif/i.test(file.type) || /\.hei[cf]$/i.test(file.name||'');
    if(isHeic){
      reject(new Error('Esse formato de foto (HEIC, comum no iPhone) não é suportado aqui. Nas opções da câmera do iPhone, mude o formato para "Mais compatível" (JPEG) ou envie um print da imagem.'));
      return;
    }
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        try{
          const scale = Math.min(1, maxW/img.width);
          const canvas = document.createElement('canvas');
          canvas.width = Math.max(1, Math.round(img.width*scale));
          canvas.height = Math.max(1, Math.round(img.height*scale));
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img,0,0,canvas.width,canvas.height);
          resolve(canvas.toDataURL('image/jpeg', quality));
        }catch(err){
          reject(new Error('Não consegui processar essa imagem no navegador. Tente outro arquivo (jpg ou png).'));
        }
      };
      img.onerror = () => reject(new Error('Não consegui abrir essa imagem. Tente um arquivo em JPG ou PNG.'));
      img.src = e.target.result;
    };
    reader.onerror = () => reject(new Error('Não consegui ler esse arquivo do dispositivo.'));
    reader.readAsDataURL(file);
  });
}

            <div class="taskdesc" id="descAlim">${renderTaskText(dayInfo.nutriText)}${partners.nutriIg ? `<div class="partner-ig">📸 Siga a Nutri Nídia: <a href="https://instagram.com/${escapeHtml(partners.nutriIg.replace(/^@/,''))}" target="_blank" rel="noopener">@${escapeHtml(partners.nutriIg.replace(/^@/,''))}</a></div>` : ''}</div>

        ${c.alimLocked ? `

        ${c.photoB ? `<img src="${c.photoB}" class="thumb">` : ''}
        ` : `
        ${dayInfo.photoB ? `

        <div class="check-row">

          <div class="txt">
            <div class="txt-head" data-toggle="descTarefa"><strong>TAREFA C · TAREFA MOVE</strong><span class="task-check" id="checkTarefa">${c.tarefa?'✓':''}</span><span>+${pts.tarefa} pontos</span><span class="chev-btn">Ver detalhes ▾</span></div>

        </div>
        <a class="whatsapp-share-btn" href="https://chat.whatsapp.com/FKxCFVkGdWgGOxuP0ZrqYv?mode=gi_t" target="_blank" rel="noopener">📲 Compartilhar no grupo</a>

      </div>

      <div id="rankingSection" style="${participantTab==='ranking'?'':'display:none;'}">

        <div class="num">${myPos>0?'#'+myPos:'—'}</div>

      </div>
      <div class="card">

        ${ranking.map((r,i)=>{
          const isYou = r.phone===session.phone;
          const isTop3 = i<3;
          const medal = i===0?'🥇':i===1?'🥈':i===2?'🥉':null;
          const nameDisplay = isTop3 ? (isYou ? 'Você' : 'Revelado na Live') : (isYou ? 'Você' : escapeHtml(r.name));

          return `
            <div class="rank-row ${isYou?'you':''}">
              <div class="left">
                <span class="pos">${medal || (i+1)}</span>
                <span class="${isTop3 && !isYou ? 'locked' : 'nm'}">${nameDisplay}</span>
              </div>
              ${ptsDisplay}
            </div>
          `;
        }).join('')}
      </div>
      </div>
    </div>
  `;

  document.getElementById('logoutBtn').onclick = ()=>{ session = {phone:null,name:null}; render(); };
  document.querySelectorAll('.txt-head[data-toggle]').forEach(head=>{
    head.onclick = ()=>{
      const target = document.getElementById(head.dataset.toggle);
      if(!target) return;
      const isOpen = target.classList.contains('open');
      target.classList.toggle('open', !isOpen);
      head.classList.toggle('open', !isOpen);
      const chevBtn = head.querySelector('.chev-btn');
      if(chevBtn) chevBtn.textContent = !isOpen ? 'Ocultar ▲' : 'Ver detalhes ▾';
    };
  });
  [['cTreino','checkTreino'], ['cAlim','checkAlim'], ['cTarefa','checkTarefa']].forEach(([boxId, badgeId])=>{
    const box = document.getElementById(boxId);
    const badge = document.getElementById(badgeId);
    if(box && badge) box.onchange = ()=>{ badge.textContent = box.checked ? '✓' : ''; };
  });
  document.querySelectorAll('.lane').forEach(l=>{
    l.onclick = ()=>{ currentDay = parseInt(l.dataset.day); participantTab='checkin'; render(); };
  });
  document.querySelectorAll('#partTabs button').forEach(btn=>{
    btn.onclick = ()=>{ participantTab = btn.dataset.tab; render(); };
  });

  let pendingPhoto = c.photo || null; // holds the processed base64 image ready to save (Task C)
  const photoInput = document.getElementById('cPhoto');
  const photoPreviewMsg = document.getElementById('photoPreviewMsg');
  if(photoInput && photoPreviewMsg){
    photoInput.onchange = async ()=>{
      const file = photoInput.files && photoInput.files[0];
      if(!file) return;
      photoPreviewMsg.innerHTML = `<div class="msg" style="background:#EEF2FF; color:#3B4CCA;">Processando imagem...</div>`;
      try{
        pendingPhoto = await resizeImage(file);
        photoPreviewMsg.innerHTML = `<div class="msg ok">Foto pronta para salvar.</div><img src="${pendingPhoto}" class="thumb">`;
      }catch(err){
        pendingPhoto = c.photo || null;
        photoPreviewMsg.innerHTML = `<div class="msg err">${escapeHtml(err.message || 'Não consegui processar essa imagem.')}</div>`;
        photoInput.value = '';
      }
    };
  }

  let pendingPhotoA = c.photoA || null;
  const photoInputA = document.getElementById('cPhotoA');
  const photoPreviewMsgA = document.getElementById('photoPreviewMsgA');
  if(photoInputA && photoPreviewMsgA){
    photoInputA.onchange = async ()=>{
      const file = photoInputA.files && photoInputA.files[0];
      if(!file) return;
      photoPreviewMsgA.innerHTML = `<div class="msg" style="background:#EEF2FF; color:#3B4CCA;">Processando imagem...</div>`;
      try{
        pendingPhotoA = await resizeImage(file);
        photoPreviewMsgA.innerHTML = `<div class="msg ok">Foto pronta para salvar.</div><img src="${pendingPhotoA}" class="thumb">`;
      }catch(err){
        pendingPhotoA = c.photoA || null;
        photoPreviewMsgA.innerHTML = `<div class="msg err">${escapeHtml(err.message || 'Não consegui processar essa imagem.')}</div>`;
        photoInputA.value = '';
      }
    };
  }

  let pendingPhotoB = c.photoB || null;
  const photoInputB = document.getElementById('cPhotoB');
  const photoPreviewMsgB = document.getElementById('photoPreviewMsgB');
  if(photoInputB && photoPreviewMsgB){
    photoInputB.onchange = async ()=>{
      const file = photoInputB.files && photoInputB.files[0];
      if(!file) return;
      photoPreviewMsgB.innerHTML = `<div class="msg" style="background:#EEF2FF; color:#3B4CCA;">Processando imagem...</div>`;
      try{
        pendingPhotoB = await resizeImage(file);
        photoPreviewMsgB.innerHTML = `<div class="msg ok">Foto pronta para salvar.</div><img src="${pendingPhotoB}" class="thumb">`;
      }catch(err){
        pendingPhotoB = c.photoB || null;
        photoPreviewMsgB.innerHTML = `<div class="msg err">${escapeHtml(err.message || 'Não consegui processar essa imagem.')}</div>`;
        photoInputB.value = '';
      }
    };
  }

  const saveTreinoBtn = document.getElementById('saveTreinoBtn');
  if(saveTreinoBtn) saveTreinoBtn.onclick = async ()=>{
    saveTreinoBtn.disabled = true; saveTreinoBtn.textContent = 'Salvando...';
    const checked = document.getElementById('cTreino').checked;
    const existing = (await getCheckin(session.phone, currentDay)) || {treino:false, alimentacao:false, tarefa:false, bonus:false, photo:null, note:''};
    const updated = {...existing, treino:checked, treinoLocked:true, photoA: pendingPhotoA, updatedAt:new Date().toISOString()};
    const saved = await setCheckin(session.phone, currentDay, updated);
    if(!saved){
      alert('Não deu pra salvar. ' + (lastStorageError || 'Tente novamente.'));
      saveTreinoBtn.disabled = false; saveTreinoBtn.textContent = 'Salvar Tarefa A';
      return;
    }
    render();
  };

  const saveAlimBtn = document.getElementById('saveAlimBtn');
  if(saveAlimBtn) saveAlimBtn.onclick = async ()=>{
    saveAlimBtn.disabled = true; saveAlimBtn.textContent = 'Salvando...';
    const checked = document.getElementById('cAlim').checked;
    const existing = (await getCheckin(session.phone, currentDay)) || {treino:false, alimentacao:false, tarefa:false, bonus:false, photo:null, note:''};
    const updated = {...existing, alimentacao:checked, alimLocked:true, photoB: pendingPhotoB, updatedAt:new Date().toISOString()};
    const saved = await setCheckin(session.phone, currentDay, updated);
    if(!saved){
      alert('Não deu pra salvar. ' + (lastStorageError || 'Tente novamente.'));
      saveAlimBtn.disabled = false; saveAlimBtn.textContent = 'Salvar Tarefa B';
      return;
    }
    render();
  };

  const saveTarefaBtn = document.getElementById('saveTarefaBtn');
  if(saveTarefaBtn) saveTarefaBtn.onclick = async ()=>{
    saveTarefaBtn.disabled = true; saveTarefaBtn.textContent = 'Salvando...';
    const msgEl = document.getElementById('checkinMsg');
    msgEl.innerHTML = '';
    const checked = document.getElementById('cTarefa').checked;
    const noteEl = document.getElementById('cNote');
    const existing = (await getCheckin(session.phone, currentDay)) || {treino:false, alimentacao:false, tarefa:false, bonus:false, photo:null, note:''};
    const updated = {
      ...existing,
      tarefa: checked,
      tarefaLocked: true,
      note: noteEl ? noteEl.value : (existing.note||''),
      photo: pendingPhoto,
      updatedAt: new Date().toISOString()
    };
    const saved = await setCheckin(session.phone, currentDay, updated);
    if(!saved){
      msgEl.innerHTML = `<div class="msg err">Não deu pra salvar agora. ${lastStorageError ? escapeHtml(lastStorageError) : 'Tente novamente.'}</div>`;
      saveTarefaBtn.disabled = false; saveTarefaBtn.textContent = 'Salvar Tarefa C';
      return;
    }
    msgEl.innerHTML = `<div class="msg ok">Tarefa C salva!</div>`;
    setTimeout(render, 700);
  };

  const finalCheckinBtn = document.getElementById('finalCheckinBtn');
  if(finalCheckinBtn) finalCheckinBtn.onclick = async ()=>{
    finalCheckinBtn.disabled = true; finalCheckinBtn.textContent = 'Confirmando...';
    const existing = (await getCheckin(session.phone, currentDay)) || {};
    const updated = {...existing, checkinDone:true, checkinDoneAt:new Date().toISOString()};
    const saved = await setCheckin(session.phone, currentDay, updated);
    if(!saved){
      alert('Não deu pra confirmar agora. ' + (lastStorageError || 'Tente novamente.'));
      finalCheckinBtn.disabled = false; finalCheckinBtn.textContent = `Fazer check-in do dia ${currentDay}`;
      return;
    }
    render();
  };
}

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}
function formatDeadline(iso){
  if(!iso) return '';
  const d = new Date(iso);
  if(isNaN(d)) return iso;
  const dd = String(d.getDate()).padStart(2,'0');
  const mm = String(d.getMonth()+1).padStart(2,'0');
  const hh = String(d.getHours()).padStart(2,'0');
  const mi = String(d.getMinutes()).padStart(2,'0');
  return `${dd}/${mm} às ${hh}:${mi}`;
}
function getUnlockDate(day){
  if(!day || !day.execDate) return null;
  const exec = new Date(day.execDate+'T00:00:00');
  if(isNaN(exec)) return null;
  exec.setDate(exec.getDate()-1);
  return exec;
}
function isDayLocked(day){
  const unlock = getUnlockDate(day);
  if(!unlock) return false;
  return new Date() < unlock;
}
function isDayPast(day){
  if(!day) return false;
  if(day.deadline){
    const dl = new Date(day.deadline);
    if(!isNaN(dl) && new Date() > dl) return true;
  }
  if(day.execDate){
    const exec = new Date(day.execDate+'T00:00:00');
    if(!isNaN(exec)){
      const endOfExecDay = new Date(exec);
      endOfExecDay.setDate(endOfExecDay.getDate()+1);
      if(new Date() >= endOfExecDay) return true;
    }
  }
  return false;
}
function getMotivationalMessage(day){
  const messages = [
    'Parabéns! Você está indo muito bem. 💪',
    'Mais um dia concluído — sua consistência está construindo o resultado! 🔥',
    'Você não parou hoje, e isso já é uma vitória. 👏',
    'Cada check-in é um passo mais perto do seu objetivo. Continue assim! ✨',
    'Orgulho de você por não desistir! Bora pro próximo dia. 🙌',
    'Isso é disciplina em ação. Siga firme! 🚀',
    'Você está construindo um hábito — e isso vale mais que qualquer pontuação. 🌱',
  ];
  return messages[((day||0) % messages.length + messages.length) % messages.length];
}
function openPhotoInNewTab(dataUri){
  try{
    const [header, base64Data] = dataUri.split(',');
    const mimeMatch = header.match(/data:(.*?);base64/);
    const mime = mimeMatch ? mimeMatch[1] : 'image/jpeg';
    const byteChars = atob(base64Data);
    const byteNumbers = new Array(byteChars.length);
    for(let i=0; i<byteChars.length; i++) byteNumbers[i] = byteChars.charCodeAt(i);
    const byteArray = new Uint8Array(byteNumbers);
    const blob = new Blob([byteArray], {type: mime});
    const url = URL.createObjectURL(blob);
    window.open(url, '_blank');
  }catch(e){
    alert('Não foi possível abrir a foto.');
  }
}
function renderTaskText(str){
  return escapeHtml(str||'').replace(/\n/g, '<br>');
}
function formatDateShort(iso){
  if(!iso) return '';
  const d = new Date(iso+'T00:00:00');
  if(isNaN(d)) return iso;
  return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}`;
}
